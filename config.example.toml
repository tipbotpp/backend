# ================================
#  APP SETTINGS
# ================================
[app]
title = "FastAPI Application"
host = "0.0.0.0"
port = 8000
workers = 1
reload = false
debug = false
tz_offset_hours = 3.0
default_offset = 0
default_limit = 20
maximum_limit = 100
allow_origins = ["*"]


# ================================
#  BOT SETTINGS
# ================================
[bot]
token = "<telegram-bot-token>"
debug = false
drop_pending_updates = true


# ================================
#  DATABASE SETTINGS
# ================================
[database]
username = "postgres"
password = "postgres"
db = "application"
host = "db"
port = 5432

echo = true
pool_pre_ping = true
pool_recycle = 1800
pool_use_lifo = true
pool_timeout = 30
pool_size = 5
max_overflow = 10


# ================================
#  S3 SETTINGS
# ================================
[s3]
aws_host = "http://minio:9000"
aws_host_internal = "http://minio:9000"
aws_host_external = "http://minio.example.com"

aws_access_key = "<minio-access-key>"
aws_secret_access_key = "<minio-secret-key>"
aws_region = "us-east-1"
aws_bucket = "app-bucket"


# ================================
#  REDIS SETTINGS
# ================================
[redis]
host = "redis"
port = 6379
db = 0
password = ""
max_connections = 10
socket_timeout = 5
socket_connect_timeout = 5


# ================================
#  LOGGING SETTINGS
# ================================
[logging]
level = "INFO"
