# ================================
#  APP SETTINGS
# ================================
[app]
title = "FastAPI Application"
host = "0.0.0.0"
port = 8000
workers = 1
reload = false
debug = false
tz_name = "Europe/Moscow"
default_offset = 0
default_limit = 20
maximum_limit = 100
allow_origins = ["*"]
mini_app_url = "https://t.me/<bot_username>/<app_short_name>"


# ================================
#  BOT SETTINGS
# ================================
[bot]
token = "<telegram-bot-token>"
debug = false
drop_pending_updates = true


# ================================
#  DATABASE SETTINGS
# ================================
[database]
username = "postgres"
password = "postgres"
db = "application"
host = "db"
port = 5432

echo = true
pool_pre_ping = true
pool_recycle = 1800
pool_use_lifo = true
pool_timeout = 30
pool_size = 5
max_overflow = 10


# ================================
#  S3 SETTINGS
# ================================
[s3]
aws_host = "http://minio:9000"
aws_host_internal = "http://minio:9000"
aws_host_external = "http://minio.example.com"

aws_access_key = "<minio-access-key>"
aws_secret_access_key = "<minio-secret-key>"
aws_region = "us-east-1"
aws_bucket = "app-bucket"


# ================================
#  REDIS SETTINGS
# ================================
[redis]
host = "redis"
port = 6379
db = 0
password = ""
max_connections = 10
socket_timeout = 5
socket_connect_timeout = 5


# ================================
#  AUTH SETTINGS (RS256 JWT)
# ================================
# Генерация ключей:
#   openssl genrsa -out private.pem 2048
#   openssl rsa -in private.pem -pubout -out public.pem
# Затем вставь содержимое файлов ниже (с \n вместо переносов строк).
[auth]
jwt_algorithm = "RS256"
jwt_expire_seconds = 2592000  # 30 дней
jwt_private_key = """
-----BEGIN RSA PRIVATE KEY-----
<вставь приватный ключ>
-----END RSA PRIVATE KEY-----
"""
jwt_public_key = """
-----BEGIN PUBLIC KEY-----
<вставь публичный ключ>
-----END PUBLIC KEY-----
"""


# ================================
#  LOGGING SETTINGS
# ================================
[logging]
level = "INFO"


# ================================
#  DEV SETTINGS (только для разработки!)
# ================================
[dev]
enabled = false
telegram_id = 100000001
username = "dev_user"
display_name = "Dev User"
mock_init_data = "your_secret_dev_token_here"
